spring.application.name=bokningssystem
# H2-databas (fil-baserad, så data sparas mellan omstarter)
spring.datasource.url=jdbc:h2:file:./data/bokningssystem
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 webbkonsol (för att kunna se databasen i webbläsaren)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console